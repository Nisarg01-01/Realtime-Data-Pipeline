name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-activate-base: true
        python-version: ${{ matrix.python-version }}
        activate-environment: realtime-pipeline
        environment-file: .github/environment.yml
        use-mamba: false
    
    - name: Install dependencies
      shell: bash -l {0}
      run: |
        pip install -r requirements.txt
    
    - name: Set PySpark environment variables
      shell: bash -l {0}
      run: |
        python -c "import sys; print(f'PYSPARK_PYTHON={sys.executable}')" >> $GITHUB_ENV
        python -c "import sys; print(f'PYSPARK_DRIVER_PYTHON={sys.executable}')" >> $GITHUB_ENV
        echo "PYSPARK_PIN_THREAD=true" >> $GITHUB_ENV
    
    - name: Verify environment
      shell: bash -l {0}
      run: |
        python verify_setup.py
    
    - name: Run unit tests
      shell: bash -l {0}
      run: |
        pytest tests/test_producer.py -v
        pytest tests/test_database.py -v
        pytest tests/test_integration.py -v
    
    - name: Run performance tests
      shell: bash -l {0}
      run: |
        pytest tests/test_performance.py -v -m performance
    
    - name: Run data transformation tests
      shell: bash -l {0}
      run: |
        pytest tests/test_data_transformations.py -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
