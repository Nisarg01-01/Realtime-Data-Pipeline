[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:cacheprovider
markers =
    performance: Performance and benchmark tests (deselect with '-m \"not performance\"')
    slow: Slow running tests
    integration: Integration tests requiring external services
# Configuration for PySpark tests to work reliably on all platforms
filterwarnings =
    ignore:.*Implementing LookupDict with __missing__.*
    ignore:.*not properly initialized.*
